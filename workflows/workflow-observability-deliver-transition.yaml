id: 5f4ff205-21cb-4874-9285-dc31f55c8d70
name: "@mgreten/observability-deliver-transition"
description: Enqueue one transition with the notification-outbox contract, then dispatch only that fresh record.
tags:
  capability: observability-transition-delivery
inputs:
  type: object
  additionalProperties: false
  properties:
    transition:
      type: object
      additionalProperties: false
      required: [workItem, event, urgency, era, payload]
      properties:
        workItem: { type: string, minLength: 1, pattern: "^[a-zA-Z0-9][a-zA-Z0-9_-]*$" }
        event: { type: string, enum: [approval-needed, failed, completed] }
        urgency: { type: string, enum: [low, default, high, urgent] }
        era: { type: string, minLength: 1 }
        payload: { type: object }
    outboxSink: { type: string, pattern: '^[A-Za-z0-9@][A-Za-z0-9@._/-]*$' }
    outboxModelType:
      type: string
      pattern: '^@[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._/-]*$'
      default: "@mgreten/notification-outbox"
    dispatchWorkflow:
      type: string
      pattern: '^@[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._/-]*$'
      default: "@mgreten/dispatch-enqueued-notifications"
    transportModel: { type: string, pattern: '^[A-Za-z0-9@][A-Za-z0-9@._/-]*$' }
    transportMethod: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$' }
    transportOptions: { type: object, default: {} }
  required: [transition, outboxSink, transportModel, transportMethod]
jobs:
  - name: enqueue-and-dispatch
    description: The evaluator owns transition identity; this workflow never invents or repeats it.
    steps:
      - name: validate-delivery-identifiers
        description: Reject unsafe dynamic targets before enqueueing the transition.
        task:
          type: assert
          expr: inputs.outboxSink.matches("^[A-Za-z0-9@][A-Za-z0-9@._/-]*$") && inputs.outboxModelType.matches("^@[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._/-]*$") && inputs.dispatchWorkflow.matches("^@[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._/-]*$") && inputs.transportModel.matches("^[A-Za-z0-9@][A-Za-z0-9@._/-]*$") && inputs.transportMethod.matches("^[A-Za-z0-9][A-Za-z0-9._-]*$")
          message: Outbox, workflow, transport, and method identifiers must use the documented safe syntax.
          severity: high
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: enqueue
        description: Persist a deduplicated transition for an enabled generic sink.
        task:
          type: model_method
          modelIdOrName: "${{ inputs.outboxSink }}"
          methodName: enqueueNotification
          inputs:
            workItem: "${{ inputs.transition.workItem }}"
            event: "${{ inputs.transition.event }}"
            urgency: "${{ inputs.transition.urgency }}"
            era: "${{ inputs.transition.era }}"
            payload: "${{ inputs.transition.payload }}"
        dependsOn: [{ step: validate-delivery-identifiers, condition: { type: succeeded } }]
        weight: 0
        allowFailure: false
      - name: dispatch
        description: Dispatch only records produced by this enqueue step.
        task:
          type: workflow
          workflowIdOrName: "${{ inputs.dispatchWorkflow }}"
          inputs:
            sourceWorkflowRunId: "${{ run.id }}"
            enqueueJobName: enqueue-and-dispatch
            enqueueStepName: enqueue
            outboxModel: "${{ inputs.outboxSink }}"
            outboxModelType: "${{ inputs.outboxModelType }}"
            transportModel: "${{ inputs.transportModel }}"
            transportMethod: "${{ inputs.transportMethod }}"
            transportOptions: "${{ inputs.transportOptions }}"
        dependsOn:
          - step: enqueue
            condition: { type: succeeded }
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
