id: 6cb6fa75-6a64-412b-b569-1e7b7c1b3734
name: "@mgreten/observability-daily-digest"
description: Read bounded evidence, normalize it, and produce a deterministic digest.
tags:
  capability: observability-digest
inputs:
  type: object
  additionalProperties: false
  properties:
    readAdapter: { type: string, minLength: 1 }
    readMethod: { type: string, minLength: 1 }
    readInputs: { type: object, default: {} }
    selector: { type: object, default: {} }
    window: { type: object, default: {} }
    normalization: { type: object, default: {} }
    severityPolicy: { type: object, default: {} }
    freshnessPolicy: { type: object, default: {} }
    normalizer: { type: string, minLength: 1 }
    normalizeMethod: { type: string, minLength: 1, default: normalize }
    digestBuilder: { type: string, minLength: 1 }
    digestMethod: { type: string, minLength: 1, default: digest }
  required: [readAdapter, readMethod, normalizer, digestBuilder]
jobs:
  - name: read-normalize-digest
    description: The ordered read→normalize→digest boundary. All read scope is caller supplied.
    steps:
      - name: read
        description: Collect one bounded, read-only observation window.
        task:
          type: model_method
          modelIdOrName: "${{ inputs.readAdapter }}"
          methodName: "${{ inputs.readMethod }}"
          inputs:
            request:
              selector: "${{ inputs.selector }}"
              window: "${{ inputs.window }}"
              options: "${{ inputs.readInputs }}"
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: normalize
        description: Convert collected records to the shared normalized observation contract.
        task:
          type: model_method
          modelIdOrName: "${{ inputs.normalizer }}"
          methodName: "${{ inputs.normalizeMethod }}"
          inputs:
            observations: >-
              ${{ data.query('workflowRunId == "' + run.id + '" && jobName == "read-normalize-digest" && stepName == "read"', 'attributes') }}
            selector: "${{ inputs.selector }}"
            window: "${{ inputs.window }}"
            normalization: "${{ inputs.normalization }}"
            severityPolicy: "${{ inputs.severityPolicy }}"
            freshnessPolicy: "${{ inputs.freshnessPolicy }}"
        dependsOn:
          - step: read
            condition: { type: succeeded }
        weight: 0
        allowFailure: false
      - name: digest
        description: Build a source-cited digest from normalized observations only.
        task:
          type: model_method
          modelIdOrName: "${{ inputs.digestBuilder }}"
          methodName: "${{ inputs.digestMethod }}"
          inputs:
            observations: >-
              ${{ data.query('workflowRunId == "' + run.id + '" && jobName == "read-normalize-digest" && stepName == "normalize"', 'attributes') }}
            selector: "${{ inputs.selector }}"
            window: "${{ inputs.window }}"
            severityPolicy: "${{ inputs.severityPolicy }}"
            freshnessPolicy: "${{ inputs.freshnessPolicy }}"
        dependsOn:
          - step: normalize
            condition: { type: succeeded }
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
